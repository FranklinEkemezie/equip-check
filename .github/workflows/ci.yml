name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [debug, release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Clang tooling
        run: sudo apt-get update && sudo apt-get install -y clang clang-tidy clang-format

      - name: Build and run unit tests
        run: make CXX=${{ matrix.compiler }} BUILD_TYPE=${{ matrix.build_type }} all

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Run clang-tidy
        run: make tidy
